<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Portfolio</title>
  <style>
    :root { --bg:#0a0c12; --bg2:#0e121b; --card:#131824; --line:#222a3a; --text:#e8ecf5; --muted:#8b95ab; --accent:#ff7a3d; --accent2:#22d3ee; --ok:#22c55e; --danger:#ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    button, input, select, textarea { font: inherit; color: inherit; }
    .top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--line); }
    .top h1 { font-size: 1.05rem; margin-right: auto; }
    .top h1 span { color: var(--accent); }
    #status { font-size: .8rem; color: var(--muted); }
    #status.dirty { color: var(--accent); }
    .btn { padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: .85rem; }
    .btn:hover { border-color: var(--accent2); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn.sm { padding: 4px 9px; font-size: .75rem; }
    .layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 57px); }
    .menu { border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow: auto; }
    .menu button { display: flex; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 4px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
    .menu button:hover { background: var(--card); color: var(--text); }
    .menu button.active { background: var(--card); color: var(--text); box-shadow: inset 3px 0 var(--accent); }
    main { padding: 24px clamp(16px, 4vw, 40px) 80px; max-width: 900px; }
    main h2 { font-size: 1.4rem; margin-bottom: 4px; }
    .hint { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    .field > label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    .field small { display: block; color: var(--muted); font-size: .72rem; margin-top: 4px; }
    input[type=text], input[type=number], input[type=url], select, textarea { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 70px; }
    input[type=color] { width: 56px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 2px; cursor: pointer; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: var(--accent); }
    .group { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; background: var(--bg2); }
    .group-h { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .group-h b { margin-right: auto; font-size: .9rem; }
    .subtitle { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent2); margin: 22px 0 10px; }
    .imgbox { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .imgbox img { width: 90px; height: 90px; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); }
    .imgbox .ph { width: 90px; height: 90px; border-radius: 14px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: .7rem; }
    .help { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent2); border-radius: 10px; padding: 14px 16px; font-size: .88rem; }
    .help ol { margin: 8px 0 0 20px; }
    .help code { background: var(--bg); padding: 1px 6px; border-radius: 5px; font-size: .8rem; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ok); color: #04210f; padding: 10px 18px; border-radius: 10px; font-weight: 600; opacity: 0; pointer-events: none; transition: .3s; z-index: 50; }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .menu { position: static; display: flex; overflow-x: auto; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
      .menu button { width: auto; white-space: nowrap; }
      .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>⚙️ Admin <span>Portfolio</span></h1>
    <span id="status">Memuat…</span>
    <button class="btn" id="btnPreview">👁 Pratinjau</button>
    <button class="btn primary" id="btnDownload">⬇ Unduh content.js</button>
    <button class="btn" id="btnImport">⬆ Impor</button>
    <button class="btn danger" id="btnReset">↺ Reset</button>
    <input type="file" id="fileImport" accept=".js,.json,.txt" hidden />
  </div>
  <div class="layout">
    <nav class="menu" id="menu"></nav>
    <main id="panel"></main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="content.js"></script>
  <script src="admin.js"></script>
</body>
</html>
